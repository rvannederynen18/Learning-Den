<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Crect width=%22100%22 height=%22100%22 rx=%2222%22 fill=%22#5b5bf0%22/%3E%3Cpath d=%22M19 10 L41 31 L59 31 L81 10 L84 47 Q84 62 72 72 L57 88 Q50 94 43 88 L28 72 Q16 62 16 47 Z%22 fill=%22#7d86b3%22/%3E%3Cpath d=%22M24 20 L37 33 L27 41 Z M76 20 L63 33 L73 41 Z%22 fill=%22#2c3163%22/%3E%3Cpath d=%22M50 40 Q66 42 74 54 Q66 62 60 72 L56 82 Q50 87 44 82 L40 72 Q34 62 26 54 Q34 42 50 40 Z%22 fill=%22#eef1fb%22/%3E%3Cpath d=%22M33 48 L44 50 L36 55 Z M67 48 L56 50 L64 55 Z%22 fill=%22#f5a400%22/%3E%3Ccircle cx=%2239%22 cy=%2251%22 r=%222.6%22 fill=%22#1c2340%22/%3E%3Ccircle cx=%2261%22 cy=%2251%22 r=%222.6%22 fill=%22#1c2340%22/%3E%3Cpath d=%22M43 68 L57 68 L50 76 Z%22 fill=%22#1c2340%22/%3E%3C/svg%3E">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Storm Chaser</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;800;900&display=swap">
<style>
/* Shared lesson shell: top bar with wallet, mode tabs, a stage card for the question, answer buttons beside it. */
:root{
  --bg:#e6f4ff; --paper:#ffffff; --ink:#0d2a3d; --muted:#4a6b7a; --line:#c6dcec; --soft:#eef6fc;
  --accent:#1d74e8; --accent-2:#0e9f6e; --gold:#f5a400; --good:#16a34a; --bad:#e5484d;
  --display:"Lilita One", "Arial Rounded MT Bold", "Trebuchet MS", system-ui, sans-serif;
  --body:"Nunito", "Trebuchet MS", system-ui, sans-serif;
  color-scheme:light;
  padding-top:env(safe-area-inset-top, 0px);padding-bottom:env(safe-area-inset-bottom, 0px);
}
:root[data-style="girl"]{ --bg:#fff0f8; --line:#f3cfe4; --soft:#fde8f3; --accent:#e0479e; --accent-2:#a855f7; --muted:#7d5a72; }
html,body{margin:0;min-height:100%}
[hidden]{display:none!important}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-weight:800;font-size:17px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
button{font-family:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:4px solid var(--gold);outline-offset:2px}
#app{max-width:1060px;margin:0 auto;padding-block:12px 28px;display:flex;flex-direction:column;gap:14px}
.bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.bar h1{font-family:var(--display);font-weight:400;font-size:clamp(26px,5vw,38px);margin:0;color:var(--accent)}
.who{color:var(--muted)}
#wallet{margin-left:auto}
.btn{background:var(--paper);border:3px solid var(--line);border-bottom-width:6px;border-radius:14px;padding:9px 16px;font-size:16px;font-weight:800}
.btn:active{border-bottom-width:3px;translate:0 3px}
.btn.go{background:var(--accent);border-color:color-mix(in srgb,var(--accent) 70%,#000);color:#fff}
.btn.small{padding:6px 12px;font-size:15px;border-bottom-width:4px}
.tabs{display:flex;gap:8px;flex-wrap:wrap}
.tab{background:var(--paper);border:3px solid var(--line);border-radius:999px;padding:8px 16px;font-weight:900;font-size:16px;color:var(--muted);display:flex;gap:8px;align-items:center}
.tab[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.game{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:16px;align-items:start}
.stagecard{background:var(--paper);border:3px solid var(--line);border-radius:24px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.qhead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.dots{display:flex;gap:5px}
.dots i{width:13px;height:13px;border-radius:50%;background:var(--line)}
.dots i.done{background:var(--accent-2)}
.dots i.now{background:var(--gold)}
#stage{display:flex;justify-content:center;align-items:center;min-height:240px;position:relative}
.prompt{font-family:var(--display);font-size:clamp(24px,5vw,34px);line-height:1.15;text-align:center;margin:0}
.side{display:flex;flex-direction:column;gap:12px}
.choices{display:grid;gap:10px}
.choice{display:flex;align-items:center;justify-content:center;gap:10px;background:var(--paper);border:3px solid var(--line);border-bottom-width:7px;border-radius:18px;padding:12px 14px;font-size:22px;font-weight:900;font-variant-numeric:tabular-nums}
.choice:active{border-bottom-width:3px;translate:0 4px}
.choice.right{border-color:var(--good);background:#e3f7ec}
.choice.wrong{border-color:var(--bad);opacity:.45;pointer-events:none}
.cheer{text-align:center;font-family:var(--display);font-size:28px;min-height:1.2em;color:var(--good)}
.cheer.no{color:var(--bad)}
.cheer.learn{color:var(--accent)}
.choice.shown{animation:shownpulse 1s ease-in-out 3}
@keyframes shownpulse{50%{box-shadow:0 0 0 6px color-mix(in srgb,var(--good) 35%,transparent)}}
.again{display:inline-block;font-family:var(--body);font-size:15px;font-weight:900;color:var(--accent);background:var(--soft);border-radius:999px;padding:2px 12px;margin-bottom:6px}
.cheer small{display:block;font-family:var(--body);font-size:16px;color:var(--ink);margin-top:4px;font-weight:800}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:center}
.overlay{position:fixed;inset:0;z-index:20;background:rgba(10,30,50,.55);display:grid;place-items:center;
  padding:max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px))}
.dialog{background:var(--paper);border-radius:24px;border:4px solid var(--accent);padding:22px;width:min(460px,100%);display:flex;flex-direction:column;gap:12px;text-align:center;max-height:100%;overflow:auto}
.dialog h2{font-family:var(--display);font-weight:400;font-size:32px;margin:0;color:var(--accent)}
.dialog p{margin:0;color:var(--muted);line-height:1.4}
.dialog .big{font-size:60px;line-height:1}
.dialog .row .btn{flex:1}
.fact{background:var(--soft);border-radius:14px;padding:10px 12px;color:var(--ink)!important}
canvas#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:30}
@media (max-width:759px){ .game{grid-template-columns:1fr} #stage{min-height:200px} }
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.sky{position:relative;width:100%;max-width:540px;aspect-ratio:16/10;border-radius:22px;overflow:hidden;background:linear-gradient(#7cc6ff,#d7efff);border:4px solid var(--paper);box-shadow:0 8px 24px rgba(0,40,80,.15);transition:background .6s}
.sky.storm{background:linear-gradient(#3b4a63,#7d8aa3)}
.sky.night{background:linear-gradient(#0f1b3d,#2c3e6b)}
.sky .ground{position:absolute;left:0;right:0;bottom:0;height:18%;background:linear-gradient(#4ade80,#16a34a)}
.sky .ground.sand{background:linear-gradient(#fde68a,#f5c451)}
.sky .result{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%) scale(.2);font-size:110px;line-height:1;opacity:0;transition:transform .6s cubic-bezier(.3,1.6,.5,1),opacity .4s}
.sky .result.on{transform:translate(-50%,-50%) scale(1);opacity:1}
.sky .flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
.sky .flash.on{animation:flash .5s steps(2) 2}
@keyframes flash{0%{opacity:.95}50%{opacity:0}}
.sky .bolt{position:absolute;top:8%;font-size:90px;opacity:0;transition:opacity .1s}
.sky .bolt.on{opacity:1}
.sky .boom{position:absolute;right:6%;top:10%;font-family:var(--display);font-size:44px;color:#fff;text-shadow:0 3px 0 #000;opacity:0;transform:scale(.6);transition:all .2s}
.sky .boom.on{opacity:1;transform:scale(1.1)}
.sky .count{position:absolute;left:6%;bottom:22%;font-family:var(--display);font-size:52px;color:#fff;text-shadow:0 3px 0 rgba(0,0,0,.4);font-variant-numeric:tabular-nums}
.jar{display:flex;gap:8px;justify-content:center;min-height:54px;flex-wrap:wrap;background:var(--soft);border:3px dashed var(--accent);border-radius:16px;padding:8px;width:100%;max-width:540px;font-size:30px;align-items:center}
.jar:empty::after{content:"Tap ingredients to add them to the sky";font-size:15px;font-weight:800;color:var(--muted)}
.ings{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%;max-width:540px}
.ing{background:var(--paper);border:3px solid var(--line);border-bottom-width:6px;border-radius:14px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:14px;font-weight:900;line-height:1.15}
.ing span{font-size:30px;line-height:1}
.ing.in{border-color:var(--accent);background:var(--soft)}
.wx{display:flex;flex-direction:column;align-items:center;gap:10px;width:100%}
.balloon{position:absolute;left:50%;bottom:16%;font-size:84px;line-height:1;transform:translate(-50%,0);transition:bottom .6s ease-out}
.therm{position:absolute;right:5%;top:10%;bottom:24%;width:22px;border-radius:12px;background:#fff;border:3px solid #fff;overflow:hidden;box-shadow:0 2px 6px rgba(0,0,0,.2)}
.therm i{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(#ef4444,#f97316);transition:height .5s}
.facty{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;max-width:540px}
.facty .big{font-size:84px;line-height:1}
.facty .stmt{font-size:clamp(19px,4.3vw,24px);line-height:1.4}
.tip{color:var(--muted);font-size:15px;text-align:center;max-width:42ch}

</style>
</head>
<body>
<div id="app">
  <div class="bar">
    <button class="btn small" id="backBtn">‹ Lessons</button>
    <h1 id="title">Storm Chaser</h1>
    <span class="who" id="who"></span>
    <div id="wallet"></div>
  </div>
  <div class="tabs" role="tablist" id="modeTabs"></div>
  <div class="game">
    <div class="stagecard">
      <div class="qhead"><div class="dots" id="dots"></div><button class="btn small" id="hearBtn">🔊 Hear it</button></div>
      <p class="prompt" id="prompt"></p>
      <div id="stage"></div>
    </div>
    <div class="side">
      <div class="choices" id="choices"></div>
      <div class="cheer" id="cheer"></div>
      <div class="row"><button class="btn go" id="nextBtn" hidden>Next ▶</button></div>
      
    </div>
  </div>
</div>
<div class="overlay" id="overlay" hidden><div class="dialog" id="dialog"></div></div>

<script src="hub-core.js"></script>
<script>
(function(){
"use strict";
const H = window.Hub, esc = H.esc;
const $ = s => document.querySelector(s);
const rnd = n => Math.floor(Math.random() * n);
const pick = a => a[rnd(a.length)];
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--){ const j = rnd(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const LESSON_ID = "storm-chaser";
const P = H.active();
const LESSON = H.LESSONS.find(l => l.id === LESSON_ID);
const LEVEL = P ? (H.levelFor(P, LESSON_ID) || (Number(P.age) >= 8 ? LESSON.levels[1].id : LESSON.levels[0].id)) : LESSON.levels[0].id;
const HARD = LEVEL === LESSON.levels[1].id;
const GIRL = P && H.style(P) === "girl";
const ROUND = 10;
const PTS = HARD ? 15 : 10;

/* ---- shared round engine ---- */
const Game = { mode:null, q:null, R:null, modes:[], stage:1 };
function confetti(emojis){
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  let c = $("#confetti"); if (!c){ c = document.createElement("canvas"); c.id = "confetti"; document.body.append(c); }
  const ctx = c.getContext("2d"), W = c.width = innerWidth, Hh = c.height = innerHeight;
  const em = emojis || Game.confetti || ["⭐","✨"];
  const Pc = Array.from({length:60}, () => ({ x:W/2, y:Hh*.4, vx:(Math.random()-.5)*14, vy:-Math.random()*12-4, s:16+Math.random()*16, e:pick(em) }));
  let t = 0;
  (function tick(){ ctx.clearRect(0,0,W,Hh); t++;
    Pc.forEach(p => { p.vy += .35; p.x += p.vx; p.y += p.vy; ctx.font = `${p.s}px sans-serif`; ctx.fillText(p.e, p.x, p.y); });
    if (t < 95) requestAnimationFrame(tick); else ctx.clearRect(0,0,W,Hh); })();
}
function renderDots(){ $("#dots").innerHTML = Array.from({length:ROUND}, (_, i) => `<i class="${i < Game.R.n ? "done" : i === Game.R.n ? "now" : ""}"></i>`).join(""); }
function renderTabs(){
  const list = Game.modes.filter(m => !m.only || m.only.includes(LEVEL));
  $("#modeTabs").innerHTML = list.map(m => `<button class="tab" role="tab" data-m="${m.id}" aria-selected="${Game.mode && Game.mode.id === m.id}"><span>${m.icon}</span>${m.name}</button>`).join("");
  $("#modeTabs").querySelectorAll(".tab").forEach(b => b.onclick = () => startMode(b.dataset.m));
}
function startMode(id){
  Game.mode = Game.modes.find(m => m.id === id); renderTabs();
  Game.R = { n:0, first:0, pts:0 }; Game.retry = []; H.sessionPts = 0; H.refreshWallet(true);
  if (!Game.baseRight) Game.baseRight = Game.right;
  Game.stage = H.stage(P, LESSON_ID);
  const lvl = LESSON.levels.find(l => l.id === LEVEL);
  $("#who").textContent = `${H.first(P)} · ${lvl ? lvl.name : ""} · stage ${Game.stage} of 5`;
  H.hush();
  if (Game.mode.setup) Game.mode.setup();
  next();
}
function next(){
  if (Game.R.n >= ROUND && !Game.retry.length) return endRound();
  $("#cheer").textContent = ""; $("#cheer").className = "cheer"; $("#nextBtn").hidden = true;
  if (Game.baseRight) Game.right = Game.baseRight;   /* drop any one-question helpers */
  renderDots();
  const due = Game.retry.findIndex(r => r.due <= Game.R.n || Game.R.n >= ROUND);
  if (due >= 0){
    const r = Game.retry.splice(due, 1)[0];
    Game.ask(Object.assign({}, r.q, { retry:true, choices:r.q.choices ? shuffle(r.q.choices) : r.q.choices, prompt:`<span class="again">Let's try this one again!</span><br>${r.q.prompt || ""}` }));
    return;
  }
  Game.mode.next();
}
/* q = { prompt, say, stage (html), choices:[{v,label}], answer, onShow(stageEl) } */
Game.ask = function(q){
  Game.q = Object.assign({ tries:0, done:false }, q, { tries:0, done:false });
  Game.q.src = q.src || q;
  $("#prompt").innerHTML = q.prompt || "";
  $("#stage").innerHTML = q.stage || "";
  $("#choices").style.visibility = ""; $("#choices").style.gridTemplateColumns = "";
  $("#choices").innerHTML = (q.choices || []).map(c => `<button class="choice" data-v="${esc(c.v)}">${c.label}</button>`).join("");
  $("#choices").querySelectorAll(".choice").forEach(b => b.onclick = () => {
    if (Game.q.done) return;
    if (b.dataset.v === String(Game.q.answer)){ b.classList.add("right"); Game.right(); }
    else { b.classList.add("wrong"); Game.wrong(); }
  });
  if (q.onShow) q.onShow($("#stage"));
  H.say(q.say || (q.prompt || "").replace(/<[^>]+>/g, ""));
};
Game.right = function(msg){
  const q = Game.q; if (!q || q.done) return; q.done = true;
  const pts = q.tries === 0 && !q.retry ? PTS : Math.ceil(PTS / 2);
  if (q.tries === 0 && !q.retry) Game.R.first++;
  Game.R.pts += pts; Game.R.n++;
  H.earn(P, pts, LESSON_ID, `${Game.mode.name}`);
  const cheer = pick(Game.cheers);
  $("#cheer").innerHTML = `${cheer} +${pts}${msg || q.explain ? `<small>${msg || q.explain}</small>` : ""}`; $("#cheer").className = "cheer";
  confetti();
  if (Game.R.n % 4 === 0) H.cheer(`Fun fact: ${H.funFact(P)}`, P, 5500); else H.cheer(cheer, P, 1400);
  H.say(`${cheer} ${(msg || q.explain || "").replace(/<[^>]+>/g, "")}`);
  renderDots();
  if (q.autoNext) setTimeout(next, q.autoNext); else $("#nextBtn").hidden = false;
};
Game.wrong = function(msg){
  const q = Game.q; if (!q || q.done) return;
  q.tries++;
  if (q.tries >= 2 && !q.noReveal) return Game.reveal(msg);
  $("#cheer").innerHTML = `Not quite. Try once more!${msg ? `<small>${msg}</small>` : ""}`; $("#cheer").className = "cheer no";
  H.say("Not quite. Try once more! " + (msg || "").replace(/<[^>]+>/g, ""));
};
/* After two wrong tries: show the right answer and why, give no points, and bring the question back later. */
Game.reveal = function(msg){
  const q = Game.q; if (!q || q.done) return; q.done = true;
  Game.R.n++;
  let label = "";
  const btn = q.answer !== undefined ? $("#choices").querySelector(`.choice[data-v="${CSS.escape(String(q.answer))}"]`) : null;
  if (btn){ btn.classList.add("right", "shown"); label = btn.textContent.trim(); }
  if (q.reveal) try { q.reveal($("#stage")); } catch(e){}
  $("#choices").querySelectorAll(".choice").forEach(b => b.disabled = true);
  const why = q.explain || msg || "";
  $("#cheer").innerHTML = `Let's learn it!<small>${label ? `The answer is <b>${label}</b>. ` : ""}${why}${q.replay !== false && (q.choices && q.choices.length && !q.onShow || q.replay) ? " We'll try it again soon." : ""}</small>`;
  $("#cheer").className = "cheer learn";
  H.say(`Let's learn it. ${label ? "The answer is " + label + ". " : ""}${why.replace(/<[^>]+>/g, "")}`);
  if (!q.retry && q.replay !== false && (q.choices && q.choices.length && !q.onShow || q.replay)) Game.retry.push({ q:q.src, due:Game.R.n + 2 });
  renderDots();
  $("#nextBtn").hidden = false;
};
function endRound(){
  const bonus = Game.R.first >= 8 ? 25 : 0;
  if (bonus) H.earn(P, bonus, LESSON_ID, "round bonus");
  const change = H.recordRound(P, LESSON_ID, Game.R.first, ROUND);
  const note = H.stageNote(change, H.stage(P, LESSON_ID));
  const fact = H.funFact(P);
  $("#dialog").innerHTML = `<div class="big">${Game.R.first >= 8 ? "🏆" : Game.mode.icon}</div>
    <h2>${Game.R.first >= 8 ? Game.winTitle : Game.doneTitle}</h2>
    <p>${Game.R.first} of ${ROUND} right on the first try. You earned ${Game.R.pts + bonus} points${bonus ? ", with a 25 point bonus" : ""}${P.guest ? "." : ` (${H.money(Game.R.pts + bonus)}).`}</p>
    <p style="color:var(--ink)">${note}</p>
    <p class="fact">${GIRL ? "🐱" : "🦔"} Fun fact: ${fact}</p>
    <div class="row"><button class="btn" id="homeB">Back to lessons</button><button class="btn" id="otherB">Pick another game</button><button class="btn go" id="againB">Play again</button></div>`;
  $("#overlay").hidden = false;
  H.say(`${Game.R.first >= 8 ? Game.winTitle : Game.doneTitle}! Fun fact: ${fact}`);
  $("#againB").onclick = () => { $("#overlay").hidden = true; if (P.guest) P.points = 0; startMode(Game.mode.id); };
  $("#otherB").onclick = () => { $("#overlay").hidden = true; chooser(); };
  $("#homeB").onclick = H.goHome;
}
function chooser(){
  const list = Game.modes.filter(m => !m.only || m.only.includes(LEVEL));
  $("#dialog").innerHTML = `<div class="big">${H.iconOf(LESSON, P)}</div><h2>${esc(H.titleOf(LESSON, P))}</h2><p>Pick a game. Each one has ${ROUND} questions.</p>
    <div style="display:grid;gap:10px">${list.map(m => `<button class="btn" data-pickm="${m.id}" style="text-align:left;display:flex;gap:12px;align-items:center"><span style="font-size:32px">${m.icon}</span><span><b>${m.name}</b><br><span style="font-weight:700;color:var(--muted);font-size:14px">${m.blurb()}</span></span></button>`).join("")}</div>
    <div class="row"><button class="btn small" id="homeB">Back to lessons</button></div>`;
  $("#overlay").hidden = false;
  $("#dialog").querySelectorAll("[data-pickm]").forEach(b => b.onclick = () => { $("#overlay").hidden = true; startMode(b.dataset.pickm); });
  $("#homeB").onclick = H.goHome;
}
$("#nextBtn").onclick = next;
$("#hearBtn").onclick = () => Game.q && H.say(Game.q.say || ($("#prompt").textContent));
$("#backBtn").onclick = H.goHome;
try { speechSynthesis.getVoices(); } catch(e){}

/* ---- this lesson's games ---- */
Game.cheers = GIRL ? ["Storm star!","Purr-fect forecast!","Go team!","Weather whiz!","Bright as lightning!"] : ["Storm chaser!","Weather whiz!","Great move!","Awesome!","Bright as lightning!"];
Game.confetti = ["⚡","🌧️","🌈","☀️","❄️"];
Game.winTitle = "Chief meteorologist!"; Game.doneTitle = "Forecast complete";
let ac = null;
function thunder(){
  if (!H.db.settings.sound) return;
  try {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    const len = ac.sampleRate * 1.6, buf = ac.createBuffer(1, len, ac.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2.2);
    const src = ac.createBufferSource(), lp = ac.createBiquadFilter(), g = ac.createGain();
    lp.type = "lowpass"; lp.frequency.value = 220; g.gain.value = .9;
    src.buffer = buf; src.connect(lp).connect(g).connect(ac.destination); src.start();
  } catch(e){}
}

/* 1. WEATHER MIXER — put the right ingredients in the sky */
const ING = { vapor:["💧","Water vapor"], warm:["☀️","Warm air rising"], cold:["❄️","Cool air"], freeze:["🥶","Freezing air"], sun:["🌞","Sunshine"], rain:["🌧️","Raindrops"], ocean:["🌊","Warm ocean water"], fast:["🚀","Air rising super fast"], ground:["🏞️","Cool ground"], sand:["🏜️","Dry sand"], candy:["🍭","Candy"] };
const RECIPES = [
  ["cloud","☁️","a cloud",["vapor","cold"],"Water vapor cools down into tiny droplets, and billions of them together make a cloud.",0],
  ["rain","🌧️","rain",["vapor","warm","cold"],"Warm air carries water vapor up, it cools into cloud droplets, and the droplets bump together until they're heavy enough to fall.",0],
  ["rainbow","🌈","a rainbow",["sun","rain"],"Sunlight shines through raindrops, and each drop splits the light into all its colors.",0],
  ["snow","❄️","snow",["vapor","freeze"],"When the air is below freezing (32°F), water vapor turns into ice crystals that stick together into snowflakes.",1],
  ["fog","🌫️","fog",["vapor","ground"],"Fog is a cloud on the ground. Moist air touches cool ground and turns into tiny droplets.",1],
  ["storm","⛈️","a thunderstorm",["vapor","fast","cold"],"Hot, wet air rises really fast into cold air high up. It builds a giant cloud, and ice bumping inside makes lightning!",1],
  ["hurricane","🌀","a hurricane",["ocean","vapor","warm"],"Hurricanes grow over warm ocean water, at least about 80°F. Warm, wet air rises and spins into a giant storm.",2]
];
Game.modes.push({ id:"mix", name:"Weather Mixer", icon:"🧪",
  blurb:() => "Mix the right ingredients to make clouds, rain, snow, rainbows and storms",
  next(){
    const st = Game.stage, lvl = HARD ? (st >= 2 ? 2 : 1) : (st >= 3 ? 1 : 0);
    const r = pick(RECIPES.filter(x => x[5] <= lvl));
    const extras = shuffle(Object.keys(ING).filter(k => !r[3].includes(k))).slice(0, HARD ? 4 : 3);
    const cards = shuffle(r[3].concat(extras));
    const chosen = new Set();
    const sky = `<div class="sky ${r[0] === "storm" ? "storm" : ""}"><div class="ground"></div><div class="result" id="wxRes">${r[1]}</div><div class="flash" id="wxFlash"></div></div>`;
    Game.ask({ prompt:`Make ${r[2]}!`, say:`Make ${r[2]}. Pick the ingredients that make it, then tap make the weather.`, explain:r[4],
      stage:`<div class="wx">${sky}<div class="jar" id="jar"></div>
        <div class="ings">${cards.map(k => `<button class="ing" data-k="${k}"><span>${ING[k][0]}</span>${ING[k][1]}</button>`).join("")}</div>
        <button class="btn go" id="mixGo">✨ Make the weather</button></div>`,
      onShow(sg){
        const drawJar = () => { $("#jar").innerHTML = [...chosen].map(k => ING[k][0]).join(" "); };
        sg.querySelectorAll(".ing").forEach(b => b.onclick = () => { if (Game.q.done) return; const k = b.dataset.k; chosen.has(k) ? chosen.delete(k) : chosen.add(k); b.classList.toggle("in", chosen.has(k)); drawJar(); });
        $("#mixGo").onclick = () => {
          if (Game.q.done) return;
          const ok = r[3].length === chosen.size && r[3].every(k => chosen.has(k));
          if (ok){ $("#wxRes").classList.add("on"); if (r[0] === "storm"){ $("#wxFlash").classList.add("on"); setTimeout(thunder, 400); } Game.right(r[4]); }
          else { const missing = r[3].filter(k => !chosen.has(k)).length, extra = [...chosen].filter(k => !r[3].includes(k)).length;
            Game.wrong(extra ? "Something in the sky doesn't belong. Take it out." : missing ? `You need ${missing} more ingredient${missing > 1 ? "s" : ""}.` : "Check your ingredients."); }
        };
      },
      reveal(sg){ chosen.clear(); r[3].forEach(k => chosen.add(k)); sg.querySelectorAll(".ing").forEach(b => b.classList.toggle("in", chosen.has(b.dataset.k))); $("#jar").innerHTML = r[3].map(k => ING[k][0]).join(" "); $("#wxRes").classList.add("on"); } });
  } });

/* 2. HOT AIR RISES — heat the balloon, then explain it */
const AIRQ = [
  ["Why does the hot air balloon float up?","Warm air is lighter than cool air, so it rises",["The balloon has wings","The basket is magnetic"],"Heating air spreads it out and makes it lighter, so warm air rises above cooler air."],
  ["What happens to air when it cools down?","It gets heavier and sinks",["It turns into fire","It floats higher"],"Cool air is packed tighter and heavier, so it sinks."],
  ["Why is the upstairs of a house often warmer?","Warm air rises",["The roof makes heat","Stairs are warm"],"Warm air floats up to the higher floors."],
  ["On a sunny beach day, why does a breeze blow in from the ocean?","Hot air over the sand rises, and cooler ocean air rushes in",["The waves blow air","Fish make wind"],"The sand heats faster than the water. Warm air over land rises and cool air from the sea slides in. That's a sea breeze!"],
  ["Why do thunderstorms often happen on hot summer afternoons?","The sun heats the ground and warm, wet air rises fast",["The moon pulls clouds","Mornings are too dark"],"Afternoon heat makes warm, moist air shoot up and build tall storm clouds."]
];
Game.modes.push({ id:"rise", name:"Hot Air Rises", icon:"🎈",
  blurb:() => "Heat the air to fly the balloon, and learn why",
  next(){
    const q = HARD ? pick(AIRQ) : pick(AIRQ.slice(0, 3 + (Game.stage >= 3 ? 1 : 0)));
    let heat = 0;
    Game.ask({ prompt:"Heat the air, then answer!", say:`Tap the burner to heat the air inside the balloon. Then, ${q[0]}`, answer:q[1],
      choices:shuffle([q[1], ...q[2]]).map(v => ({ v, label:v })), explain:q[3], replay:true,
      stage:`<div class="wx"><div class="sky"><div class="ground sand"></div><div class="balloon" id="bal">🎈</div><div class="therm"><i id="thermI" style="height:15%"></i></div></div>
        <button class="btn go" id="burn">🔥 Heat the air</button><div class="tip">${esc(q[0])}</div></div>`,
      onShow(sg){
        $("#burn").onclick = () => { heat = Math.min(5, heat + 1); $("#bal").style.bottom = (16 + heat * 13) + "%"; $("#thermI").style.height = (15 + heat * 17) + "%";
          H.say(heat < 5 ? "Hotter!" : "Up, up and away! Warm air rises.", { rate:1.1 }); if (heat >= 5) $("#burn").disabled = true; };
      } });
  } });

/* 3. LIGHTNING COUNTER — count from flash to boom to find the storm */
Game.modes.push({ id:"lightning", name:"Lightning Counter", icon:"⚡",
  blurb:() => HARD ? "Count seconds from flash to thunder: every 5 seconds is 1 mile away" : "Count the seconds between the flash and the boom",
  next(){
    const st = Game.stage;
    const secs = HARD ? (st <= 2 ? 5 * (1 + rnd(3)) : 3 + rnd(13)) : 2 + rnd(Math.min(9, 3 + st));
    const miles = Math.round(secs / 5 * 10) / 10;
    const ask = HARD ? "miles" : "secs";
    const ans = ask === "miles" ? (st <= 2 ? String(secs / 5) : String(Math.round(secs / 5))) : String(secs);
    const nAns = Number(ans);
    const opts = shuffle([...new Set([nAns, nAns + 1, Math.max(ask === "miles" ? 1 : 1, nAns - 1), nAns + 2])].slice(0, 3)).map(String);
    if (!opts.includes(ans)) opts[0] = ans;
    let started = false, n = 0, tm = 0;
    Game.ask({ prompt: ask === "miles" ? "How many miles away is the storm?" : "How many seconds from flash to BOOM?",
      say:"Tap start. When you see the lightning, count the seconds until you hear the thunder.",
      answer:ans, choices:shuffle(opts).map(v => ({ v, label: ask === "miles" ? `${v} mile${v === "1" ? "" : "s"}` : `${v} seconds` })),
      explain: ask === "miles" ? `It took ${secs} seconds. Sound travels about 1 mile every 5 seconds, so ${secs} ÷ 5 ≈ ${ans} mile${ans === "1" ? "" : "s"} away. When thunder roars, go indoors!`
                                : `It took ${secs} seconds from the flash to the boom. Light is super fast, but sound is slower, so you see lightning before you hear thunder.`,
      stage:`<div class="wx"><div class="sky storm" id="wxSky"><div class="ground"></div><div class="bolt" id="bolt" style="left:${20 + rnd(50)}%">⚡</div><div class="flash" id="wxFlash"></div><div class="boom" id="boom">BOOM!</div><div class="count" id="cnt"></div></div>
        <button class="btn go" id="wxStart">▶ Start watching</button><div class="tip">${HARD ? "Every 5 seconds = about 1 mile." : "Count out loud: one Mississippi, two Mississippi..."}</div></div>`,
      onShow(){
        $("#choices").style.visibility = "hidden";
        $("#wxStart").onclick = () => {
          if (started) return; started = true; $("#wxStart").disabled = true; $("#wxStart").textContent = "Watch the sky...";
          setTimeout(() => {
            if (!$("#bolt")) return;
            $("#bolt").classList.add("on"); $("#wxFlash").classList.add("on"); setTimeout(() => { const b = $("#bolt"); if (b) b.classList.remove("on"); }, 400);
            $("#cnt").textContent = "0";
            tm = setInterval(() => {
              const c = $("#cnt"); if (!c){ clearInterval(tm); return; }
              n++; c.textContent = n; if (!HARD || st <= 3) H.say(String(n), { rate:1.3 });
              if (n >= secs){ clearInterval(tm); const bm = $("#boom"); if (bm) bm.classList.add("on"); thunder(); const w = $("#wxStart"); if (w) w.textContent = "Now answer!"; $("#choices").style.visibility = ""; }
            }, 1000);
          }, 900 + rnd(1600));
        };
      } });
  } });

/* 4. WEATHER WISE — facts, clouds and safety */
const WQ = [
  ["☁️","Fluffy white clouds that look like cotton balls are called...","Cumulus",["Stratus","Cirrus"],"Cumulus clouds are puffy, fair-weather clouds."],
  ["🌥️","Flat, gray clouds that cover the whole sky are called...","Stratus",["Cumulus","Cirrus"],"Stratus clouds are flat layers. They can bring drizzle."],
  ["🌬️","Thin, wispy clouds high in the sky are called...","Cirrus",["Stratus","Cumulus"],"Cirrus clouds are so high and cold they're made of ice crystals."],
  ["⛈️","Giant, tall clouds that bring thunderstorms are called...","Cumulonimbus",["Cirrus","Fog"],"Cumulonimbus clouds can be taller than Mount Everest!"],
  ["⚡","Lightning is hotter than the surface of the sun.",true,"A lightning bolt can reach about 50,000°F, around five times hotter than the sun's surface."],
  ["🏠","When thunder roars, go indoors!",true,"If you can hear thunder, lightning is close enough to strike. Get inside a building or a car."],
  ["🌳","Hiding under a tall tree is a safe place in a thunderstorm.",false,"Lightning often strikes tall things. Go inside a building or car instead."],
  ["🌎","Florida has more lightning than almost anywhere else in the U.S.",true,"Florida is called the lightning capital of the country because of all its summer storms."],
  ["🌀","Hurricane season in the Atlantic lasts from June 1 to November 30.",true,"Most hurricanes happen in late summer and early fall, when the ocean is warmest."],
  ["🌡️","A thermometer measures how hot or cold it is.",true,"Thermometers measure temperature in degrees."],
  ["🌈","You can see a rainbow when the sun is behind you and rain is in front of you.",true,"Sunlight passes through the raindrops in front of you and splits into colors."],
  ["💨","An anemometer measures how fast the wind blows.",true,"Its cups spin faster when the wind is stronger."],
  ["❄️","No two snowflakes are ever exactly alike.",true,"Each snowflake grows its own way as it falls through the clouds."],
  ["🌧️","Clouds are made of tiny drops of water or ice.",true,"Billions of tiny droplets float together to make a cloud."]
];
Game.modes.push({ id:"wise", name:"Weather Wise", icon:"🌦️",
  blurb:() => "Clouds, storm safety and wild weather facts",
  setup(){ Game.usedW = new Set(); },
  next(){
    let i = shuffle(WQ.map((_, k) => k)).find(k => !Game.usedW.has(k)); if (i === undefined){ Game.usedW = new Set(); i = rnd(WQ.length); }
    Game.usedW.add(i);
    const q = WQ[i];
    if (typeof q[2] === "boolean") Game.ask({ prompt:"True or false?", say:`True or false? ${q[1]}`, answer:String(q[2]), choices:[{ v:"true", label:"👍 True" },{ v:"false", label:"👎 False" }],
      explain:`${q[2] ? "True!" : "False!"} ${q[3]}`, stage:`<div class="facty"><div class="big">${q[0]}</div><div class="stmt">${q[1]}</div></div>` });
    else Game.ask({ prompt:q[1], answer:q[2], choices:shuffle([q[2], ...q[3]]).map(v => ({ v, label:v })), explain:q[4], stage:`<div class="facty"><div class="big">${q[0]}</div></div>` });
  } });
