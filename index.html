<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Crect width=%22100%22 height=%22100%22 rx=%2222%22 fill=%22#5b5bf0%22/%3E%3Cpath d=%22M19 10 L41 31 L59 31 L81 10 L84 47 Q84 62 72 72 L57 88 Q50 94 43 88 L28 72 Q16 62 16 47 Z%22 fill=%22#7d86b3%22/%3E%3Cpath d=%22M24 20 L37 33 L27 41 Z M76 20 L63 33 L73 41 Z%22 fill=%22#2c3163%22/%3E%3Cpath d=%22M50 40 Q66 42 74 54 Q66 62 60 72 L56 82 Q50 87 44 82 L40 72 Q34 62 26 54 Q34 42 50 40 Z%22 fill=%22#eef1fb%22/%3E%3Cpath d=%22M33 48 L44 50 L36 55 Z M67 48 L56 50 L64 55 Z%22 fill=%22#f5a400%22/%3E%3Ccircle cx=%2239%22 cy=%2251%22 r=%222.6%22 fill=%22#1c2340%22/%3E%3Ccircle cx=%2261%22 cy=%2251%22 r=%222.6%22 fill=%22#1c2340%22/%3E%3Cpath d=%22M43 68 L57 68 L50 76 Z%22 fill=%22#1c2340%22/%3E%3C/svg%3E">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top, 0px);padding-bottom:env(safe-area-inset-bottom, 0px)}html,body{margin:0}[hidden]{display:none!important}</style>
<title>The Learning Den</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Learning Den">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Fredoka:wght@400;500;600;700&display=swap">
<style>
/* Layout: a classroom cubby wall — one card per child, then that child's lesson tiles. Light, bright, single look; boy/girl restyles the kid board. */
:root{
  --bg:#eef3ff; --paper:#ffffff; --ink:#1c2340; --muted:#5d6687; --line:#d6ddf2;
  --accent:#5b5bf0; --accent-ink:#ffffff; --gold:#f5a400; --good:#16a34a; --bad:#e5484d; --soft:#e4e9fb;
  --display:"Lilita One", "Arial Rounded MT Bold", "Trebuchet MS", system-ui, sans-serif;
  --body:"Fredoka", "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
  color-scheme:light;
}
:root[data-style="girl"]{ --bg:#fff0f8; --line:#f6cfe6; --accent:#e0479e; --soft:#fde3f2; --muted:#7d5a72; }
:root[data-style="boy"]{ --bg:#e6f7f4; --line:#bfe3e6; --accent:#1d74e8; --soft:#d9f3ee; --muted:#4a6b7a; }
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;transition:background .3s;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
*{box-sizing:border-box}
button,select,input{font-family:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
#app{max-width:1060px;margin:0 auto;padding-block:14px 32px;display:flex;flex-direction:column;gap:18px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.logo{background:none;border:0;padding:0;font-family:var(--display);font-size:26px;color:var(--ink);display:flex;align-items:center;gap:10px}
.logo .wolf{width:42px;height:42px;flex:none;filter:drop-shadow(0 2px 0 rgba(0,0,0,.12))}
h1,h2,h3{margin:0;text-wrap:balance}
h1{font-family:var(--display);font-weight:400;font-size:clamp(30px,6vw,44px);line-height:1.05}
h2{font-family:var(--display);font-weight:400;font-size:24px}
.lead{color:var(--muted);margin:6px 0 0;max-width:62ch;line-height:1.45;font-size:16px}
.btn{background:var(--paper);border:2px solid var(--line);border-bottom-width:5px;border-radius:12px;padding:9px 16px;font-size:16px;font-weight:600;text-decoration:none;display:inline-flex;align-items:center;gap:8px;justify-content:center}
.btn:active{border-bottom-width:2px;translate:0 3px}
.btn.primary{background:var(--accent);border-color:color-mix(in srgb,var(--accent) 70%,#000);color:var(--accent-ink)}
.btn.good{background:var(--good);border-color:#0f7a37;color:#fff}
.btn.danger{border-color:var(--bad);color:var(--bad)}
.btn.small{padding:6px 12px;font-size:14px;border-bottom-width:4px}
.btn[disabled]{opacity:.45;pointer-events:none}
.screen{display:flex;flex-direction:column;gap:18px}

/* player picker */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.pcard{background:var(--paper);border:3px solid var(--line);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:12px;text-align:left;position:relative;overflow:hidden}
.pcard::before{content:"";position:absolute;inset:0 0 auto;height:8px;background:var(--c)}
.pcard .who{display:flex;gap:12px;align-items:center}
.avatar{width:60px;height:60px;border-radius:16px;background:var(--c);display:grid;place-items:center;font-size:34px;flex:none;box-shadow:inset -4px -4px 0 rgba(0,0,0,.12)}
.pcard h2{font-size:26px}
.sub{color:var(--muted);font-size:14px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{background:var(--soft);border-radius:999px;padding:3px 10px;font-size:13px;font-weight:600}
.pcard .money{font-weight:700;color:var(--gold)}
.pcard .go{margin-top:auto}
.guest{border-style:dashed}
.guest .row{display:flex;gap:8px;flex-wrap:wrap}
.guest select{flex:1;min-width:110px;background:var(--bg);border:2px solid var(--line);border-radius:10px;padding:8px;font-size:15px}
.seg{display:flex;gap:6px;flex:1}
.seg button{flex:1;background:var(--bg);border:2px solid var(--line);border-radius:10px;padding:8px;font-weight:600;font-size:15px}
.seg button[aria-pressed="true"]{border-color:var(--accent);background:var(--soft)}

/* kid board */
.hello{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.hello .avatar{width:76px;height:76px;font-size:44px;border-radius:20px}
.hello .grow{flex:1;min-width:200px}
.bankpill{background:var(--paper);border:3px solid var(--line);border-radius:16px;padding:10px 16px;display:flex;gap:14px;align-items:center}
.bankpill b{font-family:var(--display);font-weight:400;font-size:30px;color:var(--gold);line-height:1}
.lessons{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.lesson{background:var(--paper);border:3px solid var(--line);border-bottom-width:8px;border-radius:22px;padding:18px;display:flex;flex-direction:column;gap:10px;text-decoration:none;color:inherit}
.lesson:hover{border-color:var(--accent)}
.lesson:active{border-bottom-width:3px;translate:0 5px}
.lesson .ic{font-size:60px;line-height:1}
.lesson h3{font-family:var(--display);font-weight:400;font-size:30px}
.lesson p{margin:0;color:var(--muted);line-height:1.4}
.lesson .play{margin-top:auto;align-self:flex-start;background:var(--accent);color:var(--accent-ink);border-radius:12px;padding:8px 18px;font-weight:700}
.note{font-size:14px;color:var(--muted)}
.empty{background:var(--paper);border:2px dashed var(--line);border-radius:16px;padding:20px;color:var(--muted)}

/* bank */
.panel{background:var(--paper);border:2px solid var(--line);border-radius:16px;padding:14px}
.label{font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:600;margin-bottom:4px}
.bigmoney{font-family:var(--display);font-size:clamp(44px,10vw,68px);color:var(--gold);line-height:1}
.statrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.statrow b{font-size:24px;font-variant-numeric:tabular-nums}
.history{display:flex;flex-direction:column;gap:6px}
.hrow{display:grid;grid-template-columns:1fr auto auto;gap:12px;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-variant-numeric:tabular-nums;font-size:15px}
.hrow .d{color:var(--muted)}
.hrow.pay{border-left:5px solid var(--gold)}

/* parent settings */
.tabs{display:flex;gap:8px;flex-wrap:wrap}
.tab{background:transparent;border:2px solid var(--line);border-radius:999px;padding:8px 16px;font-weight:600;font-size:15px;color:var(--muted)}
.tab[aria-selected="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.sgrid{display:grid;grid-template-columns:220px minmax(0,1fr);gap:16px;align-items:start}
.plist{display:flex;flex-direction:column;gap:8px}
.pchip{display:flex;align-items:center;gap:10px;background:var(--paper);border:2px solid var(--line);border-radius:12px;padding:8px 10px;text-align:left;font-weight:600;font-size:16px}
.pchip[aria-current="true"]{border-color:var(--accent)}
.pchip .dot{width:24px;height:24px;border-radius:7px;background:var(--c);flex:none;display:grid;place-items:center;font-size:14px}
.form{background:var(--paper);border:2px solid var(--line);border-radius:18px;padding:18px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.form h3{grid-column:1/-1;font-size:13px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:600;border-bottom:1px solid var(--line);padding-bottom:6px;margin-top:4px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field.wide{grid-column:1/-1}
.field label,.field .lab{font-weight:600;font-size:15px}
.hint{font-size:13px;color:var(--muted);line-height:1.35}
.field input[type=text],.field input[type=number],.field input[type=password],.field select,.field textarea{background:var(--bg);border:2px solid var(--line);border-radius:10px;padding:9px 10px;font-size:16px;width:100%}
.field textarea{min-height:90px;font-size:12px;font-family:ui-monospace,Menlo,monospace}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.swatch{width:36px;height:36px;border-radius:9px;border:3px solid transparent;background:var(--c)}
.swatch[aria-pressed="true"]{border-color:var(--ink)}
.lessonrow{grid-column:1/-1;display:grid;grid-template-columns:auto minmax(0,1fr) minmax(150px,220px);gap:12px;align-items:center;background:var(--bg);border-radius:14px;padding:10px 12px}
.lessonrow .ic{font-size:32px}
.lessonrow b{display:block}
.check{display:flex;align-items:center;gap:10px;font-weight:600}
.check input{width:22px;height:22px}
.form-actions{grid-column:1/-1;display:flex;gap:10px;flex-wrap:wrap;justify-content:space-between;align-items:center}
.toast{font-size:14px;color:var(--good);font-weight:600}
.ttbox{grid-column:1/-1;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}

.overlay{position:fixed;inset:0;z-index:20;background:rgba(20,24,50,.55);display:grid;place-items:center;
  padding:max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px))}
.dialog{background:var(--paper);border-radius:20px;padding:22px;width:min(400px,100%);display:flex;flex-direction:column;gap:14px;text-align:center}
.dialog p{margin:0;color:var(--muted)}
.dialog .row{display:flex;gap:10px}
.dialog .row .btn{flex:1}
.pin-input{font-size:28px;text-align:center;letter-spacing:.4em;padding:10px;border-radius:10px;border:2px solid var(--line);background:var(--bg);width:100%}
.err{color:var(--bad);font-size:14px;min-height:1.2em}

@media (max-width:759px){
  .sgrid{grid-template-columns:1fr}
  .plist{flex-direction:row;flex-wrap:wrap}
  .form,.ttbox{grid-template-columns:1fr;padding:14px}
  .lessonrow{grid-template-columns:auto minmax(0,1fr)}
  .lessonrow select{grid-column:1/-1}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div id="app">
  <header class="top">
    <button class="logo" id="homeBtn"><svg class="wolf" viewBox="0 0 64 64" aria-hidden="true"><polygon points="9,3 25,21 7,27" fill="#3e4f6b"/><polygon points="55,3 39,21 57,27" fill="#3e4f6b"/><polygon points="12,9 21,20 11,23" fill="#f3b7a6"/><polygon points="52,9 43,20 53,23" fill="#f3b7a6"/><polygon points="7,23 32,14 57,23 53,41 32,61 11,41" fill="#566b8c"/><polygon points="20,31 32,24 44,31 40,47 32,57 24,47" fill="#e3e9f2"/><polygon points="17,29 27,32 20,35" fill="#ffcf3f"/><polygon points="47,29 37,32 44,35" fill="#ffcf3f"/><polygon points="27,47 37,47 32,53" fill="#1c2340"/></svg>The Learning Den</button>
    <button class="btn small" id="parentBtn">Parent settings</button>
  </header>
  <section class="screen" id="who"></section>
  <section class="screen" id="board" hidden></section>
  <section class="screen" id="bank" hidden></section>
  <section class="screen" id="parent" hidden></section>
</div>
<div class="overlay" id="overlay" hidden><div class="dialog" id="dialog"></div></div>

<script src="hub-core.js"></script>
<script>
(function(){
"use strict";
const H = window.Hub, esc = H.esc;
const $ = s => document.querySelector(s);
const db = () => H.db;
const fmt = n => Math.round(n).toLocaleString();
const date = d => new Date(d).toLocaleDateString(undefined, { month:"short", day:"numeric" });
const lessonTitle = id => id === "parent" ? "Parent adjustment" : (H.LESSONS.find(l => l.id === id) || { title:id }).title;
const avatar = p => H.STYLES[H.style(p)].avatar;

function show(name, style){
  ["who","board","bank","parent"].forEach(s => $("#" + s).hidden = s !== name);
  if (style) document.documentElement.dataset.style = style; else delete document.documentElement.dataset.style;
  window.scrollTo(0, 0);
}
function dialog(html){ $("#dialog").innerHTML = html; $("#overlay").hidden = false; }
function closeDialog(){ $("#overlay").hidden = true; }

let unlockedUntil = 0;
function requirePin(then){
  const pin = db().settings.pin;
  if (!pin || Date.now() < unlockedUntil) return then();
  dialog(`<h2>Parent PIN</h2><p>Enter the PIN to continue.</p>
    <input class="pin-input" id="pinIn" type="password" inputmode="numeric" maxlength="8" autocomplete="off">
    <div class="err" id="pinErr"></div>
    <div class="row"><button class="btn" id="pinNo">Cancel</button><button class="btn primary" id="pinOk">Unlock</button></div>`);
  const inp = $("#pinIn"); inp.focus();
  const ok = () => { if (inp.value === pin){ unlockedUntil = Date.now() + 10*60*1000; closeDialog(); then(); } else { $("#pinErr").textContent = "That PIN doesn't match. Try again."; inp.value = ""; inp.focus(); } };
  $("#pinOk").onclick = ok; inp.onkeydown = e => { if (e.key === "Enter") ok(); };
  $("#pinNo").onclick = closeDialog;
}

/* ---------- Who's learning ---------- */
function renderWho(){
  const g = db().guest;
  const ages = Array.from({length:10}, (_, i) => i + 4);
  $("#who").innerHTML = `
    <div><h1>Who's learning today?</h1>
      <p class="lead">Each player gets lessons picked for their age. Points from the games go into their bank and turn into allowance.</p></div>
    <div class="cards">
      ${db().profiles.map(p => `
        <button class="pcard" data-pick="${p.id}" style="--c:${p.color}">
          <div class="who"><div class="avatar">${avatar(p)}</div><div><h2>${esc(H.first(p))}</h2><div class="sub">${esc(p.name)}<br>Age ${esc(p.age)} · ${H.STYLES[H.style(p)].theme}</div></div></div>
          <div class="chips">${H.curriculum(p).map(c => `<span class="chip">${H.iconOf(c.lesson, p)} ${H.titleOf(c.lesson, p)}: ${c.level.name}</span>`).join("") || `<span class="chip">No lessons for this age yet</span>`}</div>
          <div class="money">${H.money(p.points)} · ${fmt(p.points)} pts in the bank</div>
        </button>`).join("")}
      <div class="pcard guest" style="--c:#a8b3c7">
        <div class="who"><div class="avatar">👋</div><div><h2>Guest</h2><div class="sub">For friends and visitors. Nothing is saved.</div></div></div>
        <div class="row">
          <select id="gAge" aria-label="Guest age">${ages.map(a => `<option value="${a}" ${a === g.age ? "selected" : ""}>Age ${a}</option>`).join("")}</select>
          <div class="seg"><button type="button" data-g="girl" aria-pressed="${g.gender === "girl"}">🐱 Girl</button><button type="button" data-g="boy" aria-pressed="${g.gender === "boy"}">🦔 Boy</button></div>
        </div>
        <button class="btn primary go" id="guestGo">Play as guest</button>
      </div>
    </div>`;
  document.querySelectorAll("[data-pick]").forEach(b => b.onclick = () => { H.setActive(b.dataset.pick); openBoard(); });
  $("#gAge").onchange = e => { g.age = Number(e.target.value); H.save(); };
  document.querySelectorAll("[data-g]").forEach(b => b.onclick = () => { g.gender = b.dataset.g; H.save(); renderWho(); });
  $("#guestGo").onclick = () => { H.setActive("guest"); openBoard(); };
  show("who");
}

/* ---------- Kid board ---------- */
function openBoard(){
  const p = H.active(); if (!p) return renderWho();
  const list = H.curriculum(p);
  $("#board").innerHTML = `
    <div class="hello">
      <div class="avatar" style="--c:${p.color}">${avatar(p)}</div>
      <div class="grow"><h1>Hi, ${esc(H.first(p))}!</h1><p class="lead">${p.guest ? "Playing as a guest, so scores won't be saved." : "Pick a game to play."}</p></div>
      <div style="display:flex;flex-direction:column;gap:6px;align-items:stretch"><div id="boardWallet"></div>${p.guest ? "" : `<button class="btn small" id="toBank">Open my bank ›</button>`}</div>
    </div>
    <div class="lessons">
      ${list.length ? list.map(c => `
        <a class="lesson" href="${c.lesson.file}">
          <span class="ic">${H.iconOf(c.lesson, p)}</span>
          <div class="chips"><span class="chip">${c.lesson.subject}</span><span class="chip">${c.level.name} level</span></div>
          <h3>${H.titleOf(c.lesson, p)}</h3>
          <p>${c.level.blurb}</p>
          <span class="play">Play ▶</span>
        </a>`).join("") : `<div class="empty">No lessons are set for this age yet. A parent can turn lessons on in Parent settings.</div>`}
    </div>
    <div><button class="btn" id="switchBtn">Switch player</button></div>`;
  const tb = $("#toBank"); if (tb) tb.onclick = () => openBank(p.id);
  H.wallets = []; H.sessionPts = 0; H.mountWallet($("#boardWallet"), p);
  setTimeout(() => H.cheer(`Hi ${H.first(p)}! Fun fact: ${H.funFact(p)}`, p, 6000), 400);
  $("#switchBtn").onclick = renderWho;
  show("board", H.style(p));
}

/* ---------- Bank ---------- */
function openBank(id){
  const p = H.profile(id); if (!p || p.guest) return;
  const pays = db().payouts.filter(x => x.pid === id);
  const paid = pays.reduce((s, x) => s + x.dollars, 0);
  $("#bank").innerHTML = `
    <div class="hello"><div class="avatar" style="--c:${p.color}">${avatar(p)}</div>
      <div class="grow"><h1>${esc(H.first(p))}'s bank</h1><p class="lead">Every ${fmt(db().settings.pointsPerDollar)} points = $1.00. ${fmt(p.points)} points ÷ ${fmt(db().settings.pointsPerDollar)} = ${H.money(p.points)}.</p></div></div>
    <div class="panel" style="display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between">
      <div><div class="label">Ready to cash in</div><div class="bigmoney">${H.money(p.points)}</div><div class="sub">${fmt(p.points)} points</div></div>
      <div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn" id="bankBack">Back</button><button class="btn primary" id="payOut" ${H.dollars(p.points) < .01 ? "disabled" : ""}>Pay out (parent)</button></div>
    </div>
    <div class="statrow">
      <div class="panel"><div class="label">Points earned ever</div><b>${fmt(p.lifetime)}</b></div>
      <div class="panel"><div class="label">Paid out so far</div><b>$${paid.toFixed(2)}</b></div>
      <div class="panel"><div class="label">Times Tower best</div><b>${fmt(p.tt.best)}</b></div>
      <div class="panel"><div class="label">Animals found</div><b>${p.ws.found.length} of 50</b></div>
      <div class="panel"><div class="label">Planets visited</div><b>${(p.ph ? p.ph.visited.length : 0)} of 8</b></div>
    </div>
    <h2>Earned by game</h2>
    <div class="history">${H.LESSONS.map(l => { const pts = (p.earnedBy || {})[l.id] || 0; return `<div class="hrow"><span>${l.icon} ${l.title}</span><span class="d">${fmt(pts)} pts</span><b>${H.money(pts)}</b></div>`; }).join("")}
      <div class="hrow" style="font-weight:700"><span>All games, ever</span><span class="d">${fmt(p.lifetime)} pts</span><b>${H.money(p.lifetime)}</b></div></div>
    <h2>Payouts</h2>
    <div class="history">${pays.length ? pays.slice().reverse().slice(0,20).map(x => `<div class="hrow pay"><span>Paid out</span><span class="d">${date(x.date)}</span><b>$${x.dollars.toFixed(2)}</b></div>`).join("") : `<p class="note">No payouts yet.</p>`}</div>
    <h2>Recent points</h2>

  show("bank", H.style(p));

/* ---------- Pay out ----------
   The parent picks how much to pay. That many dollars' worth of points comes off the balance,
   and the payout is recorded in the bank history. */
function payOut(id, after){
  const p = H.profile(id); if (!p || p.guest) return;
  const rate = db().settings.pointsPerDollar;
  const max = Math.floor(H.dollars(p.points) * 100) / 100;
  if (max < .01){ dialog(`<h2>Nothing to pay yet</h2><p>${esc(H.first(p))} has ${fmt(p.points)} points, which is less than 1 cent.</p><div class="row"><button class="btn primary" id="payNo">OK</button></div>`); $("#payNo").onclick = closeDialog; return; }
  const quick = [1, 5, 10, 20].filter(v => v < max);
  dialog(`<h2>Pay ${esc(H.first(p))}</h2>
    <p>Balance: <b>${H.money(p.points)}</b> (${fmt(p.points)} points)</p>
    <label for="payAmt" style="font-weight:600">Amount to pay ($)</label>
    <input class="pin-input" id="payAmt" type="number" inputmode="decimal" min="0.01" max="${max.toFixed(2)}" step="0.01" value="${max.toFixed(2)}" style="letter-spacing:0">
    <div class="row" style="flex-wrap:wrap">${quick.map(v => `<button class="btn small" data-amt="${v}">$${v}</button>`).join("")}<button class="btn small" data-amt="${max.toFixed(2)}">All ${H.money(p.points)}</button></div>
    <p id="payNote"></p>
    <div class="err" id="payErr"></div>
    <div class="row"><button class="btn" id="payNo">Cancel</button><button class="btn good" id="payYes">Pay out</button></div>`);
  const inp = $("#payAmt");
  const amount = () => Math.round((Number(inp.value) || 0) * 100) / 100;
  const note = () => {
    const d = Math.min(amount(), max), left = Math.max(0, p.points - Math.round(d * rate));
    $("#payNote").textContent = d > 0 ? `Takes ${fmt(Math.round(d * rate))} points out. ${H.first(p)} will have ${H.money(left)} left.` : "";
    $("#payYes").textContent = d > 0 ? `Pay $${d.toFixed(2)}` : "Pay out";
  };
  inp.oninput = note; note();
  $("#dialog").querySelectorAll("[data-amt]").forEach(b => b.onclick = () => { inp.value = Number(b.dataset.amt).toFixed(2); note(); });
  $("#payNo").onclick = closeDialog;
  $("#payYes").onclick = () => {
    const d = amount();
    if (!(d > 0)) return $("#payErr").textContent = "Enter an amount more than $0.";
    if (d > max) return $("#payErr").textContent = `${H.first(p)} only has ${H.money(p.points)}.`;
    const used = Math.min(p.points, Math.round(d * rate));
    H.snapshot(`before paying ${H.first(p)} $${d.toFixed(2)}`);
    p.points -= used; p.paidPoints = (p.paidPoints || 0) + used;
    db().payouts.push({ pid:p.id, date:Date.now(), dollars:d, points:used });
    H.save(); closeDialog();
    if (after) after();
  };
  inp.focus(); inp.select();
}
/* Parent balance fix: add, take away, or set an exact balance (for example, from the kids' own tally if this device's data was ever wiped). */
function adjustBalance(id, after){
  const p = H.profile(id); if (!p || p.guest) return;
  const rate = db().settings.pointsPerDollar;
  dialog(`<h2>Adjust ${esc(H.first(p))}'s bank</h2>
    <p>Now: <b>${H.money(p.points)}</b> (${fmt(p.points)} points)</p>
    <div class="seg" id="adjMode"><button type="button" data-m="add" aria-pressed="true">Add</button><button type="button" data-m="sub" aria-pressed="false">Take away</button><button type="button" data-m="set" aria-pressed="false">Set balance</button></div>
    <div class="seg" id="adjUnit"><button type="button" data-u="usd" aria-pressed="true">Dollars ($)</button><button type="button" data-u="pts" aria-pressed="false">Points</button></div>
    <input class="pin-input" id="adjAmt" type="number" inputmode="decimal" min="0" step="0.01" placeholder="0.00" style="letter-spacing:0">
    <input class="pin-input" id="adjWhy" type="text" maxlength="60" placeholder="Reason (optional)" style="letter-spacing:0;font-size:18px">
    <p id="adjNote"></p><div class="err" id="adjErr"></div>
    <div class="row"><button class="btn" id="adjNo">Cancel</button><button class="btn primary" id="adjYes">Save</button></div>`);
  let mode = "add", unit = "usd";
  const seg = (sel, attr, set) => $(sel).querySelectorAll("button").forEach(b => b.onclick = () => { $(sel).querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", x === b)); set(b.dataset[attr]); note(); });
  const pts = () => { const v = Number($("#adjAmt").value) || 0; return Math.round(unit === "usd" ? v * rate : v); };
  const after_ = () => mode === "add" ? p.points + pts() : mode === "sub" ? Math.max(0, p.points - pts()) : pts();
  const note = () => { $("#adjAmt").step = unit === "usd" ? "0.01" : "1"; $("#adjAmt").placeholder = unit === "usd" ? "0.00" : "0"; $("#adjNote").textContent = $("#adjAmt").value === "" ? "" : `New balance: ${H.money(after_())} (${fmt(after_())} points)`; };
  seg("#adjMode", "m", v => mode = v); seg("#adjUnit", "u", v => unit = v); $("#adjAmt").oninput = note;
  $("#adjNo").onclick = closeDialog;
  $("#adjYes").onclick = () => {
    if ($("#adjAmt").value === "" || (Number($("#adjAmt").value) || 0) < 0) return $("#adjErr").textContent = "Enter an amount.";
    const target = after_(), delta = target - p.points;
    if (!delta) return closeDialog();
    H.snapshot(`before adjusting ${H.first(p)}'s balance`);
    p.points = target; if (delta > 0) p.lifetime = (p.lifetime || 0) + delta;
    p.history.unshift({ d:Date.now(), lesson:"parent", pts:delta, note:$("#adjWhy").value.trim() || (mode === "set" ? "balance set by a parent" : "") });
    p.history = p.history.slice(0, 80);
    H.save(); closeDialog(); if (after) after();
  };
  $("#adjAmt").focus();
}
/* Undo the most recent payout (for a mistake): puts the points back. */
function undoPayout(id, after){
  const list = db().payouts; let i = -1;
  for (let k = list.length - 1; k >= 0; k--) if (list[k].pid === id){ i = k; break; }
  if (i < 0) return;
  const x = list[i], p = H.profile(id);
  dialog(`<h2>Undo payout?</h2><p>This puts ${fmt(x.points)} points ($${x.dollars.toFixed(2)}) from ${date(x.date)} back into ${esc(H.first(p))}'s bank.</p>
    <div class="row"><button class="btn" id="unNo">Cancel</button><button class="btn primary" id="unYes">Undo it</button></div>`);
  $("#unNo").onclick = closeDialog;
  $("#unYes").onclick = () => { H.snapshot(`before undoing a payout for ${H.first(p)}`); p.points += x.points; p.paidPoints = Math.max(0, (p.paidPoints || 0) - x.points); list.splice(i, 1); H.save(); closeDialog(); if (after) after(); };
}

    <div class="form-actions"><span class="toast" id="bToast"></span></div>
  </form>`;
  $("#copyB").onclick = () => { const ta = $("#f-backup"); const fb = () => { ta.focus(); ta.select(); toast("#bToast", "Selected. Use your device's Copy."); };
    try { navigator.clipboard.writeText(ta.value).then(() => toast("#bToast", "Copied"), fb); } catch(e){ fb(); } };
  const btn = $("#doRestore");
  btn.onclick = () => {
    let d; try { d = JSON.parse($("#f-restore").value); } catch(e){ return toast("#bToast", "That text isn't a valid backup."); }
    if (!d || !Array.isArray(d.profiles)) return toast("#bToast", "That text isn't a Learning Den backup.");
    if (!btn.dataset.armed){ btn.dataset.armed = "1"; btn.textContent = "Tap again to confirm"; return; }
    H.snapshot("before restoring backup text"); H.db = d; H.save(); location.reload();
  };
  $("#sBody").querySelectorAll("[data-snap]").forEach(b => b.onclick = () => {
    if (!b.dataset.armed){ b.dataset.armed = "1"; b.textContent = "Tap again to restore"; setTimeout(() => { if (b.isConnected){ delete b.dataset.armed; b.textContent = "Restore"; } }, 4000); return; }
    if (H.restoreSnapshot(Number(b.dataset.snap))){ toast("#bToast", "Restored"); setTimeout(() => location.reload(), 600); } else toast("#bToast", "That copy couldn't be read.");
  });
}

$("#homeBtn").onclick = renderWho;
$("#parentBtn").onclick = () => requirePin(() => openParent("players"));

/* Coming back from a game goes straight to that player's lessons. */
const act = H.active();
if (act && sessionStorage && (() => { try { return sessionStorage.getItem("hub-return") === "1"; } catch(e){ return false; } })()){
  try { sessionStorage.removeItem("hub-return"); } catch(e){}
  openBoard();
} else renderWho();
})();
</script>
</body>
</html>
