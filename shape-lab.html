<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Crect width=%22100%22 height=%22100%22 rx=%2222%22 fill=%22#5b5bf0%22/%3E%3Cpath d=%22M19 10 L41 31 L59 31 L81 10 L84 47 Q84 62 72 72 L57 88 Q50 94 43 88 L28 72 Q16 62 16 47 Z%22 fill=%22#7d86b3%22/%3E%3Cpath d=%22M24 20 L37 33 L27 41 Z M76 20 L63 33 L73 41 Z%22 fill=%22#2c3163%22/%3E%3Cpath d=%22M50 40 Q66 42 74 54 Q66 62 60 72 L56 82 Q50 87 44 82 L40 72 Q34 62 26 54 Q34 42 50 40 Z%22 fill=%22#eef1fb%22/%3E%3Cpath d=%22M33 48 L44 50 L36 55 Z M67 48 L56 50 L64 55 Z%22 fill=%22#f5a400%22/%3E%3Ccircle cx=%2239%22 cy=%2251%22 r=%222.6%22 fill=%22#1c2340%22/%3E%3Ccircle cx=%2261%22 cy=%2251%22 r=%222.6%22 fill=%22#1c2340%22/%3E%3Cpath d=%22M43 68 L57 68 L50 76 Z%22 fill=%22#1c2340%22/%3E%3C/svg%3E">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shape Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;800;900&display=swap">
<style>
/* Shared lesson shell: top bar with wallet, mode tabs, a stage card for the question, answer buttons beside it. */
:root{
  --bg:#e6f4ff; --paper:#ffffff; --ink:#0d2a3d; --muted:#4a6b7a; --line:#c6dcec; --soft:#eef6fc;
  --accent:#1d74e8; --accent-2:#0e9f6e; --gold:#f5a400; --good:#16a34a; --bad:#e5484d;
  --display:"Lilita One", "Arial Rounded MT Bold", "Trebuchet MS", system-ui, sans-serif;
  --body:"Nunito", "Trebuchet MS", system-ui, sans-serif;
  color-scheme:light;
  padding-top:env(safe-area-inset-top, 0px);padding-bottom:env(safe-area-inset-bottom, 0px);
}
:root[data-style="girl"]{ --bg:#fff0f8; --line:#f3cfe4; --soft:#fde8f3; --accent:#e0479e; --accent-2:#a855f7; --muted:#7d5a72; }
html,body{margin:0;min-height:100%}
[hidden]{display:none!important}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-weight:800;font-size:17px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
button{font-family:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:4px solid var(--gold);outline-offset:2px}
#app{max-width:1060px;margin:0 auto;padding-block:12px 28px;display:flex;flex-direction:column;gap:14px}
.bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.bar h1{font-family:var(--display);font-weight:400;font-size:clamp(26px,5vw,38px);margin:0;color:var(--accent)}
.who{color:var(--muted)}
#wallet{margin-left:auto}
.btn{background:var(--paper);border:3px solid var(--line);border-bottom-width:6px;border-radius:14px;padding:9px 16px;font-size:16px;font-weight:800}
.btn:active{border-bottom-width:3px;translate:0 3px}
.btn.go{background:var(--accent);border-color:color-mix(in srgb,var(--accent) 70%,#000);color:#fff}
.btn.small{padding:6px 12px;font-size:15px;border-bottom-width:4px}
.tabs{display:flex;gap:8px;flex-wrap:wrap}
.tab{background:var(--paper);border:3px solid var(--line);border-radius:999px;padding:8px 16px;font-weight:900;font-size:16px;color:var(--muted);display:flex;gap:8px;align-items:center}
.tab[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.game{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:16px;align-items:start}
.stagecard{background:var(--paper);border:3px solid var(--line);border-radius:24px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.qhead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.dots{display:flex;gap:5px}
.dots i{width:13px;height:13px;border-radius:50%;background:var(--line)}
.dots i.done{background:var(--accent-2)}
.dots i.now{background:var(--gold)}
#stage{display:flex;justify-content:center;align-items:center;min-height:240px;position:relative}
.prompt{font-family:var(--display);font-size:clamp(24px,5vw,34px);line-height:1.15;text-align:center;margin:0}
.side{display:flex;flex-direction:column;gap:12px}
.choices{display:grid;gap:10px}
.choice{display:flex;align-items:center;justify-content:center;gap:10px;background:var(--paper);border:3px solid var(--line);border-bottom-width:7px;border-radius:18px;padding:12px 14px;font-size:22px;font-weight:900;font-variant-numeric:tabular-nums}
.choice:active{border-bottom-width:3px;translate:0 4px}
.choice.right{border-color:var(--good);background:#e3f7ec}
.choice.wrong{border-color:var(--bad);opacity:.45;pointer-events:none}
.cheer{text-align:center;font-family:var(--display);font-size:28px;min-height:1.2em;color:var(--good)}
.cheer.no{color:var(--bad)}
.cheer.learn{color:var(--accent)}
.choice.shown{animation:shownpulse 1s ease-in-out 3}
@keyframes shownpulse{50%{box-shadow:0 0 0 6px color-mix(in srgb,var(--good) 35%,transparent)}}
.again{display:inline-block;font-family:var(--body);font-size:15px;font-weight:900;color:var(--accent);background:var(--soft);border-radius:999px;padding:2px 12px;margin-bottom:6px}
.cheer small{display:block;font-family:var(--body);font-size:16px;color:var(--ink);margin-top:4px;font-weight:800}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:center}
.overlay{position:fixed;inset:0;z-index:20;background:rgba(10,30,50,.55);display:grid;place-items:center;
  padding:max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px))}
.dialog{background:var(--paper);border-radius:24px;border:4px solid var(--accent);padding:22px;width:min(460px,100%);display:flex;flex-direction:column;gap:12px;text-align:center;max-height:100%;overflow:auto}
.dialog h2{font-family:var(--display);font-weight:400;font-size:32px;margin:0;color:var(--accent)}
.dialog p{margin:0;color:var(--muted);line-height:1.4}
.dialog .big{font-size:60px;line-height:1}
.dialog .row .btn{flex:1}
.fact{background:var(--soft);border-radius:14px;padding:10px 12px;color:var(--ink)!important}
canvas#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:30}
@media (max-width:759px){ .game{grid-template-columns:1fr} #stage{min-height:200px} }
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.shapebox{display:flex;flex-direction:column;align-items:center;gap:10px}
.shapebox svg{width:min(60vw,220px);height:auto;overflow:visible}
.shapebox .emo{font-size:110px;line-height:1}
.choice svg{width:40px;height:40px;flex:none}
.grid{width:min(86vw,420px);height:auto}
.grid text{font-family:var(--body);font-weight:900}
.tip{color:var(--muted);font-size:15px;text-align:center;max-width:40ch}

</style>
</head>
<body>
<div id="app">
  <div class="bar">
    <button class="btn small" id="backBtn">‹ Lessons</button>
    <h1 id="title">Shape Lab</h1>
    <span class="who" id="who"></span>
    <div id="wallet"></div>
  </div>
  <div class="tabs" role="tablist" id="modeTabs"></div>
  <div class="game">
    <div class="stagecard">
      <div class="qhead"><div class="dots" id="dots"></div><button class="btn small" id="hearBtn">🔊 Hear it</button></div>
      <p class="prompt" id="prompt"></p>
      <div id="stage"></div>
    </div>
    <div class="side">
      <div class="choices" id="choices"></div>
      <div class="cheer" id="cheer"></div>
      <div class="row"><button class="btn go" id="nextBtn" hidden>Next ▶</button></div>
      
    </div>
  </div>
</div>
<div class="overlay" id="overlay" hidden><div class="dialog" id="dialog"></div></div>

<script src="hub-core.js"></script>
<script>
(function(){
"use strict";
const H = window.Hub, esc = H.esc;
const $ = s => document.querySelector(s);
const rnd = n => Math.floor(Math.random() * n);
const pick = a => a[rnd(a.length)];
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--){ const j = rnd(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const LESSON_ID = "shape-lab";
const P = H.active();
const LESSON = H.LESSONS.find(l => l.id === LESSON_ID);
const LEVEL = P ? (H.levelFor(P, LESSON_ID) || (Number(P.age) >= 8 ? LESSON.levels[1].id : LESSON.levels[0].id)) : LESSON.levels[0].id;
const HARD = LEVEL === LESSON.levels[1].id;
const GIRL = P && H.style(P) === "girl";
const ROUND = 10;
const PTS = HARD ? 15 : 10;

/* ---- shared round engine ---- */
const Game = { mode:null, q:null, R:null, modes:[], stage:1 };
function confetti(emojis){
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  let c = $("#confetti"); if (!c){ c = document.createElement("canvas"); c.id = "confetti"; document.body.append(c); }
  const ctx = c.getContext("2d"), W = c.width = innerWidth, Hh = c.height = innerHeight;
  const em = emojis || Game.confetti || ["⭐","✨"];
  const Pc = Array.from({length:60}, () => ({ x:W/2, y:Hh*.4, vx:(Math.random()-.5)*14, vy:-Math.random()*12-4, s:16+Math.random()*16, e:pick(em) }));
  let t = 0;
  (function tick(){ ctx.clearRect(0,0,W,Hh); t++;
    Pc.forEach(p => { p.vy += .35; p.x += p.vx; p.y += p.vy; ctx.font = `${p.s}px sans-serif`; ctx.fillText(p.e, p.x, p.y); });
    if (t < 95) requestAnimationFrame(tick); else ctx.clearRect(0,0,W,Hh); })();
}
function renderDots(){ $("#dots").innerHTML = Array.from({length:ROUND}, (_, i) => `<i class="${i < Game.R.n ? "done" : i === Game.R.n ? "now" : ""}"></i>`).join(""); }
function renderTabs(){
  const list = Game.modes.filter(m => !m.only || m.only.includes(LEVEL));
  $("#modeTabs").innerHTML = list.map(m => `<button class="tab" role="tab" data-m="${m.id}" aria-selected="${Game.mode && Game.mode.id === m.id}"><span>${m.icon}</span>${m.name}</button>`).join("");
  $("#modeTabs").querySelectorAll(".tab").forEach(b => b.onclick = () => startMode(b.dataset.m));
}
function startMode(id){
  Game.mode = Game.modes.find(m => m.id === id); renderTabs();
  Game.R = { n:0, first:0, pts:0 }; Game.retry = []; H.sessionPts = 0; H.refreshWallet(true);
  if (!Game.baseRight) Game.baseRight = Game.right;
  Game.stage = H.stage(P, LESSON_ID);
  const lvl = LESSON.levels.find(l => l.id === LEVEL);
  $("#who").textContent = `${H.first(P)} · ${lvl ? lvl.name : ""} · stage ${Game.stage} of 5`;
  H.hush();
  if (Game.mode.setup) Game.mode.setup();
  next();
}
function next(){
  if (Game.R.n >= ROUND && !Game.retry.length) return endRound();
  $("#cheer").textContent = ""; $("#cheer").className = "cheer"; $("#nextBtn").hidden = true;
  if (Game.baseRight) Game.right = Game.baseRight;   /* drop any one-question helpers */
  renderDots();
  const due = Game.retry.findIndex(r => r.due <= Game.R.n || Game.R.n >= ROUND);
  if (due >= 0){
    const r = Game.retry.splice(due, 1)[0];
    Game.ask(Object.assign({}, r.q, { retry:true, choices:r.q.choices ? shuffle(r.q.choices) : r.q.choices, prompt:`<span class="again">Let's try this one again!</span><br>${r.q.prompt || ""}` }));
    return;
  }
  Game.mode.next();
}
/* q = { prompt, say, stage (html), choices:[{v,label}], answer, onShow(stageEl) } */
Game.ask = function(q){
  Game.q = Object.assign({ tries:0, done:false }, q, { tries:0, done:false });
  Game.q.src = q.src || q;
  $("#prompt").innerHTML = q.prompt || "";
  $("#stage").innerHTML = q.stage || "";
  $("#choices").style.visibility = ""; $("#choices").style.gridTemplateColumns = "";
  $("#choices").innerHTML = (q.choices || []).map(c => `<button class="choice" data-v="${esc(c.v)}">${c.label}</button>`).join("");
  $("#choices").querySelectorAll(".choice").forEach(b => b.onclick = () => {
    if (Game.q.done) return;
    if (b.dataset.v === String(Game.q.answer)){ b.classList.add("right"); Game.right(); }
    else { b.classList.add("wrong"); Game.wrong(); }
  });
  if (q.onShow) q.onShow($("#stage"));
  H.say(q.say || (q.prompt || "").replace(/<[^>]+>/g, ""));
};
Game.right = function(msg){
  const q = Game.q; if (!q || q.done) return; q.done = true;
  const pts = q.tries === 0 && !q.retry ? PTS : Math.ceil(PTS / 2);
  if (q.tries === 0 && !q.retry) Game.R.first++;
  Game.R.pts += pts; Game.R.n++;
  H.earn(P, pts, LESSON_ID, `${Game.mode.name}`);
  const cheer = pick(Game.cheers);
  $("#cheer").innerHTML = `${cheer} +${pts}${msg || q.explain ? `<small>${msg || q.explain}</small>` : ""}`; $("#cheer").className = "cheer";
  confetti();
  if (Game.R.n % 4 === 0) H.cheer(`Fun fact: ${H.funFact(P)}`, P, 5500); else H.cheer(cheer, P, 1400);
  H.say(`${cheer} ${(msg || q.explain || "").replace(/<[^>]+>/g, "")}`);
  renderDots();
  if (q.autoNext) setTimeout(next, q.autoNext); else $("#nextBtn").hidden = false;
};
Game.wrong = function(msg){
  const q = Game.q; if (!q || q.done) return;
  q.tries++;
  if (q.tries >= 2 && !q.noReveal) return Game.reveal(msg);
  $("#cheer").innerHTML = `Not quite. Try once more!${msg ? `<small>${msg}</small>` : ""}`; $("#cheer").className = "cheer no";
  H.say("Not quite. Try once more! " + (msg || "").replace(/<[^>]+>/g, ""));
};
/* After two wrong tries: show the right answer and why, give no points, and bring the question back later. */
Game.reveal = function(msg){
  const q = Game.q; if (!q || q.done) return; q.done = true;
  Game.R.n++;
  let label = "";
  const btn = q.answer !== undefined ? $("#choices").querySelector(`.choice[data-v="${CSS.escape(String(q.answer))}"]`) : null;
  if (btn){ btn.classList.add("right", "shown"); label = btn.textContent.trim(); }
  if (q.reveal) try { q.reveal($("#stage")); } catch(e){}
  $("#choices").querySelectorAll(".choice").forEach(b => b.disabled = true);
  const why = q.explain || msg || "";
  $("#cheer").innerHTML = `Let's learn it!<small>${label ? `The answer is <b>${label}</b>. ` : ""}${why}${q.replay !== false && (q.choices && q.choices.length && !q.onShow || q.replay) ? " We'll try it again soon." : ""}</small>`;
  $("#cheer").className = "cheer learn";
  H.say(`Let's learn it. ${label ? "The answer is " + label + ". " : ""}${why.replace(/<[^>]+>/g, "")}`);
  if (!q.retry && q.replay !== false && (q.choices && q.choices.length && !q.onShow || q.replay)) Game.retry.push({ q:q.src, due:Game.R.n + 2 });
  renderDots();
  $("#nextBtn").hidden = false;
};
function endRound(){
  const bonus = Game.R.first >= 8 ? 25 : 0;
  if (bonus) H.earn(P, bonus, LESSON_ID, "round bonus");
  const change = H.recordRound(P, LESSON_ID, Game.R.first, ROUND);
  const note = H.stageNote(change, H.stage(P, LESSON_ID));
  const fact = H.funFact(P);
  $("#dialog").innerHTML = `<div class="big">${Game.R.first >= 8 ? "🏆" : Game.mode.icon}</div>
    <h2>${Game.R.first >= 8 ? Game.winTitle : Game.doneTitle}</h2>
    <p>${Game.R.first} of ${ROUND} right on the first try. You earned ${Game.R.pts + bonus} points${bonus ? ", with a 25 point bonus" : ""}${P.guest ? "." : ` (${H.money(Game.R.pts + bonus)}).`}</p>
    <p style="color:var(--ink)">${note}</p>
    <p class="fact">${GIRL ? "🐱" : "🦔"} Fun fact: ${fact}</p>
    <div class="row"><button class="btn" id="homeB">Back to lessons</button><button class="btn" id="otherB">Pick another game</button><button class="btn go" id="againB">Play again</button></div>`;
  $("#overlay").hidden = false;
  H.say(`${Game.R.first >= 8 ? Game.winTitle : Game.doneTitle}! Fun fact: ${fact}`);
  $("#againB").onclick = () => { $("#overlay").hidden = true; if (P.guest) P.points = 0; startMode(Game.mode.id); };
  $("#otherB").onclick = () => { $("#overlay").hidden = true; chooser(); };
  $("#homeB").onclick = H.goHome;
}
function chooser(){
  const list = Game.modes.filter(m => !m.only || m.only.includes(LEVEL));
  $("#dialog").innerHTML = `<div class="big">${H.iconOf(LESSON, P)}</div><h2>${esc(H.titleOf(LESSON, P))}</h2><p>Pick a game. Each one has ${ROUND} questions.</p>
    <div style="display:grid;gap:10px">${list.map(m => `<button class="btn" data-pickm="${m.id}" style="text-align:left;display:flex;gap:12px;align-items:center"><span style="font-size:32px">${m.icon}</span><span><b>${m.name}</b><br><span style="font-weight:700;color:var(--muted);font-size:14px">${m.blurb()}</span></span></button>`).join("")}</div>
    <div class="row"><button class="btn small" id="homeB">Back to lessons</button></div>`;
  $("#overlay").hidden = false;
  $("#dialog").querySelectorAll("[data-pickm]").forEach(b => b.onclick = () => { $("#overlay").hidden = true; startMode(b.dataset.pickm); });
  $("#homeB").onclick = H.goHome;
}
$("#nextBtn").onclick = next;
$("#hearBtn").onclick = () => Game.q && H.say(Game.q.say || ($("#prompt").textContent));
$("#backBtn").onclick = H.goHome;
try { speechSynthesis.getVoices(); } catch(e){}

/* ---- this lesson's games ---- */
Game.cheers = GIRL ? ["Shape-tastic!","Purr-fect!","Go team!","Geometry star!","Sharp thinking!"] : ["Shape-tastic!","Great move!","Geometry pro!","Awesome!","Sharp thinking!"];
Game.confetti = ["🔷","🔺","⭐","🟣", GIRL ? "🎀" : "🟩"];
Game.winTitle = "Shape master!"; Game.doneTitle = "Lab complete";
const FILL = GIRL ? "#f9a8d4" : "#7dd3fc", EDGE = GIRL ? "#be185d" : "#0369a1";
const poly = (n, r = 80, rot = -90) => Array.from({length:n}, (_, i) => { const a = (rot + i * 360 / n) * Math.PI / 180; return `${(100 + r * Math.cos(a)).toFixed(1)},${(100 + r * Math.sin(a)).toFixed(1)}`; }).join(" ");
/* name: [svg body, sides, corners, kind] */
const SH = {
  circle:[`<circle cx="100" cy="100" r="80"/>`, 0, 0, "2d"],
  oval:[`<ellipse cx="100" cy="100" rx="88" ry="56"/>`, 0, 0, "2d"],
  triangle:[`<polygon points="${poly(3, 88, -90)}"/>`, 3, 3, "2d"],
  square:[`<rect x="25" y="25" width="150" height="150"/>`, 4, 4, "2d"],
  rectangle:[`<rect x="10" y="50" width="180" height="100"/>`, 4, 4, "2d"],
  rhombus:[`<polygon points="100,12 170,100 100,188 30,100"/>`, 4, 4, "2d"],
  star:[`<polygon points="${Array.from({length:10}, (_, i) => { const r = i % 2 ? 36 : 88, a = (-90 + i * 36) * Math.PI / 180; return `${(100 + r * Math.cos(a)).toFixed(1)},${(100 + r * Math.sin(a)).toFixed(1)}`; }).join(" ")}"/>`, 10, 10, "2d"],
  heart:[`<path d="M100 172 C30 120 18 84 40 56 C62 30 92 40 100 66 C108 40 138 30 160 56 C182 84 170 120 100 172 Z"/>`, 0, 0, "2d"],
  pentagon:[`<polygon points="${poly(5)}"/>`, 5, 5, "2d"],
  hexagon:[`<polygon points="${poly(6, 82, 0)}"/>`, 6, 6, "2d"],
  octagon:[`<polygon points="${poly(8, 84, 22.5)}"/>`, 8, 8, "2d"],
  trapezoid:[`<polygon points="55,45 145,45 185,160 15,160"/>`, 4, 4, "2d"],
  parallelogram:[`<polygon points="55,50 190,50 145,150 10,150"/>`, 4, 4, "2d"],
  cube:[`<polygon points="40,70 130,70 130,160 40,160"/><polygon points="40,70 75,38 165,38 130,70" style="filter:brightness(1.15)"/><polygon points="130,70 165,38 165,128 130,160" style="filter:brightness(.85)"/>`, 12, 8, "3d"],
  sphere:[`<circle cx="100" cy="100" r="80"/><ellipse cx="100" cy="100" rx="80" ry="22" fill="none" stroke-dasharray="6 6"/><circle cx="72" cy="70" r="16" fill="#fff" opacity=".5" stroke="none"/>`, 0, 0, "3d"],
  cone:[`<polygon points="100,18 170,160 30,160"/><ellipse cx="100" cy="160" rx="70" ry="20"/>`, 1, 1, "3d"],
  cylinder:[`<rect x="45" y="40" width="110" height="120"/><ellipse cx="100" cy="160" rx="55" ry="16"/><ellipse cx="100" cy="40" rx="55" ry="16" style="filter:brightness(1.15)"/>`, 2, 0, "3d"],
  pyramid:[`<polygon points="100,20 35,150 120,175"/><polygon points="100,20 120,175 175,140" style="filter:brightness(.85)"/>`, 8, 5, "3d"]
};
const NICE = { rhombus:"diamond (rhombus)" };
const nm = s => NICE[s] || s;
function svg(name, opts){
  opts = opts || {};
  const [body] = SH[name];
  const line = opts.line ? `<line x1="${opts.line[0]}" y1="${opts.line[1]}" x2="${opts.line[2]}" y2="${opts.line[3]}" stroke="var(--ink)" stroke-width="5" stroke-dasharray="12 9"/>` : "";
  return `<svg viewBox="0 0 200 200" aria-hidden="true"><g fill="${opts.fill || FILL}" stroke="${EDGE}" stroke-width="5" stroke-linejoin="round">${body}</g>${line}</svg>`;
}
const pool = () => {
  const st = Game.stage;
  const easy = ["circle","square","triangle","rectangle","oval","star","heart","rhombus"];
  const hard = ["pentagon","hexagon","octagon","trapezoid","parallelogram","cube","sphere","cone","cylinder","pyramid"];
  return HARD ? easy.slice(2).concat(hard.slice(0, 4 + st)) : easy.slice(0, 4 + st).concat(st >= 4 ? ["pentagon","hexagon"] : []);
};
const opts3 = (ans, list) => shuffle([ans, ...shuffle(list.filter(x => x !== ans)).slice(0, 2)]);
const SAY_SIDES = { triangle:"3 straight sides", square:"4 equal sides", rectangle:"4 sides, with opposite sides the same length", rhombus:"4 equal sides, tipped like a kite",
  pentagon:"5 sides", hexagon:"6 sides, like a honeycomb", octagon:"8 sides, like a stop sign", trapezoid:"4 sides with one pair of parallel sides", parallelogram:"4 sides with two pairs of parallel sides",
  circle:"no straight sides, it's perfectly round", oval:"no straight sides, like a stretched circle", star:"points sticking out all around", heart:"two round bumps on top and a point at the bottom",
  cube:"6 square faces, like a dice", sphere:"a round 3D shape, like a ball", cone:"a circle bottom and a point on top, like an ice cream cone", cylinder:"two circle ends, like a can", pyramid:"triangle sides that meet at a point" };

/* 1. NAME THAT SHAPE */
Game.modes.push({ id:"name", name:"Name That Shape", icon:"🔺",
  blurb:() => HARD ? "Polygons and 3D shapes" : "Circles, squares, triangles and more",
  next(){
    const list = pool(), s = pick(list);
    Game.ask({ prompt:"What shape is this?", answer:s, choices:opts3(s, list).map(v => ({ v, label:`${svg(v)}${nm(v)}` })),
      explain:`It's a ${nm(s)}. It has ${SAY_SIDES[s]}.`, stage:`<div class="shapebox">${svg(s)}</div>` });
  } });

/* 2. SIDES & CORNERS */
Game.modes.push({ id:"sides", name:"Sides & Corners", icon:"📐",
  blurb:() => HARD ? "Count sides, corners, faces and edges" : "Count the sides and corners",
  next(){
    const flat = pool().filter(s => SH[s][3] === "2d" && !["star","heart"].includes(s) && (HARD || SH[s][1] <= 6));
    const s = pick(flat), [, sides, corners] = SH[s];
    if (HARD && Game.stage >= 3 && Math.random() < .4){
      const solid = pick(["cube","pyramid","cylinder","cone"]);
      const q = { cube:["faces",6,"A cube has 6 square faces, like a dice."], pyramid:["corners (points)",5,"A square pyramid has 4 corners on the bottom and 1 on top, so 5."], cylinder:["flat faces",2,"A cylinder has 2 flat circle faces, one on each end."], cone:["flat faces",1,"A cone has 1 flat circle face on the bottom."] }[solid];
      Game.ask({ prompt:`How many ${q[0]} does a ${solid} have?`, answer:String(q[1]), choices:shuffle([q[1], q[1] + 1, Math.max(0, q[1] - 1) === q[1] ? q[1] + 2 : Math.max(0, q[1] - 1)]).map(v => ({ v:String(v), label:String(v) })),
        explain:q[2], stage:`<div class="shapebox">${svg(solid)}</div>` });
      return;
    }
    const askCorners = Math.random() < .4 && sides > 0;
    const n = askCorners ? corners : sides;
    if (HARD && Math.random() < .35){
      const names = flat.filter(x => SH[x][1] > 0);
      Game.ask({ prompt:`Which shape has ${sides} sides?`, answer:s, choices:opts3(s, names.filter(x => SH[x][1] !== sides).concat(s)).map(v => ({ v, label:`${svg(v)}${nm(v)}` })),
        explain:`A ${nm(s)} has ${SAY_SIDES[s]}.`, stage:`<div class="shapebox"><div class="emo">${sides}</div><div class="tip">sides</div></div>` });
      return;
    }
    Game.ask({ prompt:`How many ${askCorners ? "corners" : "sides"} does a ${nm(s)} have?`, answer:String(n),
      choices:shuffle([...new Set([n, n + 1, n > 0 ? n - 1 : n + 2, n + 2])].slice(0, 3)).map(v => ({ v:String(v), label:String(v) })),
      explain: sides === 0 ? `A ${nm(s)} has no straight sides and no corners. It's curved all the way around.` : `A ${nm(s)} has ${sides} sides and ${corners} corners. Every corner is where two sides meet.`,
      stage:`<div class="shapebox">${svg(s)}<div class="tip">Touch each ${askCorners ? "corner" : "side"} and count out loud!</div></div>` });
  } });

/* 3. SHAPE SPOTTER — shapes in everyday life */
const SPOT = [["🍕","a slice of pizza","triangle",0],["🚪","a door","rectangle",0],["🍩","a donut","circle",0],["⭐","a star sticker","star",0],["❤️","a valentine","heart",0],
  ["🪁","a kite","rhombus",0],["📺","a TV","rectangle",0],["🕐","a clock","circle",0],["🥚","an egg","oval",0],["🧇","a waffle","square",1],["🛑","a stop sign","octagon",1],
  ["🐝","a honeycomb cell","hexagon",1],["🎲","a dice","cube",2],["⚽","a soccer ball","sphere",2],["🍦","an ice cream cone","cone",2],["🥫","a soup can","cylinder",2],["🎁","a gift box","cube",2],["🏀","a basketball","sphere",2],["🔺","the top of a tent","triangle",0]];
Game.modes.push({ id:"spot", name:"Shape Spotter", icon:"🔍",
  blurb:() => "Find shapes in things you see every day",
  next(){
    const list = SPOT.filter(x => HARD ? true : x[3] === 0 || (x[3] === 1 && Game.stage >= 4));
    const it = pick(list), names = [...new Set(list.map(x => x[2]))];
    Game.ask({ prompt:`What shape is ${it[1]}?`, answer:it[2], choices:opts3(it[2], names).map(v => ({ v, label:`${svg(v)}${nm(v)}` })),
      explain:`${it[1][0].toUpperCase() + it[1].slice(1)} is shaped like a ${nm(it[2])}. It has ${SAY_SIDES[it[2]]}.`, stage:`<div class="shapebox"><div class="emo">${it[0]}</div></div>` });
  } });

/* 4. SYMMETRY — does the line make two matching halves? */
const SYM = [["heart",[100,10,100,190],true],["heart",[10,100,190,100],false],["square",[100,10,100,190],true],["square",[25,25,175,175],true],["rectangle",[100,30,100,170],true],
  ["rectangle",[10,50,190,150],false,"A rectangle folded corner to corner doesn't match up."],["triangle",[100,5,100,190],true],["triangle",[10,120,190,120],false],["circle",[100,10,100,190],true],["circle",[30,30,170,170],true],
  ["star",[100,5,100,195],true],["oval",[10,100,190,100],true],["parallelogram",[100,30,100,170],false,"The slanted sides don't match when you fold it."],["hexagon",[10,100,190,100],true],["trapezoid",[100,30,100,175],true],["trapezoid",[10,100,190,100],false]];
const LINES = { square:4, rectangle:2, triangle:3, circle:"lots (it never ends)", hexagon:6, heart:1, star:5, oval:2, pentagon:5, octagon:8 };
Game.modes.push({ id:"symmetry", name:"Symmetry", icon:"🦋",
  blurb:() => HARD ? "Lines of symmetry: fold it and see if both halves match" : "Does the line make two matching halves?",
  next(){
    if (HARD && Game.stage >= 3 && Math.random() < .5){
      const s = pick(Object.keys(LINES)), n = String(LINES[s]);
      const all = ["1","2","3","4","5","6","8","lots (it never ends)"];
      Game.ask({ prompt:`How many lines of symmetry does a ${nm(s)} have?`, answer:n, choices:opts3(n, all).map(v => ({ v, label:v })),
        explain:`A ${nm(s)} has ${n} line${n === "1" ? "" : "s"} of symmetry. Each one splits it into two matching halves, like folding paper.`, stage:`<div class="shapebox">${svg(s)}</div>` });
      return;
    }
    const [s, line, yes, why] = pick(SYM);
    Game.ask({ prompt:"Is the dashed line a line of symmetry?", say:"If you folded the shape on the dashed line, would both halves match?", answer:String(yes),
      choices:[{ v:"true", label:"👍 Yes, the halves match" },{ v:"false", label:"👎 No, they don't match" }],
      explain: yes ? `Yes! Fold the ${nm(s)} on that line and both halves match exactly, like a butterfly's wings.` : `No. ${why || `Fold the ${nm(s)} on that line and the two halves won't match up.`}`,
      stage:`<div class="shapebox">${svg(s, { line })}<div class="tip">Imagine folding it on the dashed line.</div></div>` });
  } });

/* 5. AREA & PERIMETER (Architect) */
function gridSVG(w, h, showNums){
  const u = Math.min(46, Math.floor(380 / Math.max(w, h))), W = w * u + 60, Hh = h * u + 60;
  let g = "";
  for (let x = 0; x < w; x++) for (let y = 0; y < h; y++) g += `<rect x="${30 + x * u}" y="${30 + y * u}" width="${u}" height="${u}" fill="${FILL}" stroke="${EDGE}" stroke-width="1.5"/>${showNums ? `<text x="${30 + x * u + u / 2}" y="${30 + y * u + u / 2 + 6}" text-anchor="middle" font-size="${Math.round(u * .38)}" fill="${EDGE}">${y * w + x + 1}</text>` : ""}`;
  return `<svg class="grid" viewBox="0 0 ${W} ${Hh}" role="img" aria-label="${w} by ${h} rectangle">${g}<rect x="30" y="30" width="${w * u}" height="${h * u}" fill="none" stroke="${EDGE}" stroke-width="5"/>
    <text x="${30 + w * u / 2}" y="22" text-anchor="middle" font-size="18" fill="var(--ink)">${w} units</text><text x="${36 + w * u}" y="${34 + h * u / 2}" font-size="18" fill="var(--ink)">${h}</text></svg>`;
}
Game.modes.push({ id:"area", name:"Area & Perimeter", icon:"📏", only:["architect"],
  blurb:() => "Area = squares inside. Perimeter = the distance all the way around",
  next(){
    const st = Game.stage, w = 2 + rnd(2 + st), h = 2 + rnd(1 + st);
    const area = Math.random() < .5;
    const ans = area ? w * h : 2 * (w + h);
    const wrong = area ? [2 * (w + h), w + h] : [w * h, w + h];
    Game.ask({ prompt: area ? "What is the area?" : "What is the perimeter?",
      say: area ? `How many squares are inside? That's the area.` : `How far is it all the way around the outside? That's the perimeter.`,
      answer:String(ans), choices:shuffle([...new Set([ans, ...wrong, ans + 2])].slice(0, 3)).map(v => ({ v:String(v), label:`${v} ${area ? "square units" : "units"}` })),
      explain: area ? `Area = ${w} × ${h} = ${ans} square units. That's ${h} rows of ${w} squares.` : `Perimeter = ${w} + ${h} + ${w} + ${h} = ${ans} units. Add up all four sides.`,
      stage:`<div class="shapebox">${gridSVG(w, h, area && st <= 1)}</div>` });
  } });


/* ---- boot ---- */
if (!P){
  $("#dialog").innerHTML = `<h2>Who's playing?</h2><p>Pick a player on the home page first.</p><div class="row"><button class="btn go" id="toHub">Go to the home page</button></div>`;
  $("#overlay").hidden = false; $("#toHub").onclick = () => { location.href = H.homeUrl; };
} else {
  document.documentElement.dataset.style = H.style(P);
  $("#title").textContent = H.titleOf(LESSON, P); document.title = H.titleOf(LESSON, P);
  const lvl = LESSON.levels.find(l => l.id === LEVEL);
  $("#who").textContent = `${H.first(P)} · ${lvl ? lvl.name : ""} level`;
  H.mountWallet($("#wallet"), P);
  chooser();
}
})();
</script>
</body>
</html>
